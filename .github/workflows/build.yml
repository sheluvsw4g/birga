name: Build Swift App (macOS & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Package on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          echo "=== Selected Xcode Version ==="
          xcodebuild -version
          echo "=== Swift Version ==="
          swift --version

      - name: Run Unit Tests
        run: swift test -v

      - name: Build macOS Release Binary
        run: swift build -c release --product TonRateTracker

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project for iOS
        run: |
          xcodegen generate
          # Ensure backwards compatibility with Xcode 15 if format 77 was generated
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TonRateTracker.xcodeproj/project.pbxproj || true

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project TonRateTracker.xcodeproj \
            -scheme TonRateTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TonRateTracker.app Payload/
          # Ensure any framework inside Frameworks has an Info.plist or remove static artifact
          if [ -d "Payload/TonRateTracker.app/Frameworks" ]; then
            for fw in Payload/TonRateTracker.app/Frameworks/*.framework; do
              if [ -d "$fw" ] && [ ! -f "$fw/Info.plist" ]; then
                echo "Removing framework without Info.plist: $fw"
                rm -rf "$fw"
              fi
            done
            rmdir Payload/TonRateTracker.app/Frameworks 2>/dev/null || true
          fi
          zip -r TonRateTracker.ipa Payload
          ls -la TonRateTracker.ipa

      - name: Prepare macOS Artifacts
        run: |
          mkdir -p artifacts
          cp .build/release/TonRateTracker artifacts/
          cd artifacts
          zip -r TonRateTracker-macOS.zip TonRateTracker

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonRateTracker-iOS-IPA
          path: TonRateTracker.ipa
          retention-days: 14

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonRateTracker-macOS
          path: artifacts/TonRateTracker-macOS.zip
          retention-days: 14
