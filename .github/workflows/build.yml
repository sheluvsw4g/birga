name: Build Swift App (macOS & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Package on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment info
        run: |
          echo "=== Swift Version ==="
          swift --version
          echo "=== Xcode Version ==="
          xcodebuild -version

      - name: Run Unit Tests
        run: swift test -v

      - name: Build macOS Release Binary
        run: swift build -c release --product TonRateTracker

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project for iOS
        run: xcodegen generate

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project TonRateTracker.xcodeproj \
            -scheme TonRateTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TonRateTracker.app Payload/
          zip -r TonRateTracker.ipa Payload
          ls -la TonRateTracker.ipa

      - name: Prepare macOS Artifacts
        run: |
          mkdir -p artifacts
          cp .build/release/TonRateTracker artifacts/
          cd artifacts
          zip -r TonRateTracker-macOS.zip TonRateTracker

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonRateTracker-iOS-IPA
          path: TonRateTracker.ipa
          retention-days: 14

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonRateTracker-macOS
          path: artifacts/TonRateTracker-macOS.zip
          retention-days: 14
